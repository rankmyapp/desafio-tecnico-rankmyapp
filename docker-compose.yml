services:
  mysql_db:
    image: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_DATABASE:-mydb}
      - MYSQL_USER=${DB_USERNAME:-daniel}
      - MYSQL_PASSWORD=${DB_PASSWORD:-daniel}

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
  tickets-api:
    build: ./tickets-api
    container_name: tickets-api
    ports:
      - "3000:3000"
    depends_on:
      - mysql_db
      - redis
    environment:
      # Database Configuration
      - DB_TYPE=mysql
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-daniel}
      - DB_PASSWORD=${DB_PASSWORD:-daniel}
      - DB_DATABASE=${DB_DATABASE:-mydb}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-true}
      
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET:-anySecret}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1h}
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
